server {
    listen 80;
    server_name _;

    root /travian/main_script/copyable/public;
    index index.php;

    client_max_body_size 64M;

    # nginx resolves an upstream host once at startup and caches it forever, so
    # recreating the php container left every request returning 502 against a
    # stale IP. Going through a variable forces re-resolution via Docker's
    # embedded DNS, and the stack heals itself within `valid`.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream php:9000;

    # Without this nginx rewrites `return 302 /login/` into an absolute URL built
    # from $host, dropping the port: on localhost:8080 the redirect landed on
    # localhost/login/ and died. Relative Location headers resolve correctly.
    absolute_redirect off;

    # The Angular lobby offered e-mail sign-up and password sign-in, which no
    # longer exist. It ships as a minified bundle with no sources, so it cannot
    # be edited - it is retired in favour of the OAuth page instead. Its static
    # assets stay reachable under /lobby-assets/ in case anything is salvaged.
    location = /lobby {
        return 302 /login/;
    }

    location ^~ /lobby/ {
        return 302 /login/;
    }

    location ^~ /lobby-assets/ {
        alias /travian/angularIndex/browser/;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }

    location ^~ /v1/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /travian/sections/api/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $uri;
        fastcgi_pass $php_upstream;
    }

    # The OAuth sign-in page is served by the API, not by the Angular lobby:
    # that bundle is minified with no sources, so it cannot carry new buttons.
    location ~ ^/(login|shop)(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /travian/sections/api/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $uri;
        fastcgi_pass $php_upstream;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /gpack/ {
        alias /travian/sections/gpack/;
        try_files $uri $uri/ =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~ \.php$ {
        try_files $uri /index.php?$query_string;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_index index.php;
        fastcgi_pass $php_upstream;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }
}
