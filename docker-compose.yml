services:
  db:
    build:
      context: ./docker/db
    environment:
      MYSQL_ROOT_PASSWORD: root
      TRAVIAN_WORLD_ID: dev
      TRAVIAN_WORLD_UNIQUE_ID: "9"
      TRAVIAN_WORLD_URL: http://localhost:8080/
      # Map size is the radius: 50 means a 101x101 world (~10k tiles), which
      # installs in under a minute. 200 means 401x401 (~160k tiles) and needs
      # several GB of RAM in the installer.
      TRAVIAN_MAP_SIZE: "50"
      TRAVIAN_SPEED: "3"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
      - ./:/travian:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  redis:
    image: redis:6
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Identities, OAuth round trips and the coin ledger. In production point
  # IDENTITY_DB_* at your existing Postgres instead and stop this service:
  # the schema is confined to `identity`, so it drops into a database that
  # already holds other tables.
  identity_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${IDENTITY_DB_NAME:-identity}
      POSTGRES_USER: ${IDENTITY_DB_USER:-identity}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity}
    volumes:
      - identity_data:/var/lib/postgresql/data
      - ./docker/identity/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IDENTITY_DB_USER:-identity} -d ${IDENTITY_DB_NAME:-identity}"]
      interval: 5s
      timeout: 5s
      retries: 20

  php:
    build:
      context: ./docker/php
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      IDENTITY_DB_HOST: ${IDENTITY_DB_HOST:-identity_db}
      IDENTITY_DB_PORT: ${IDENTITY_DB_PORT:-5432}
      IDENTITY_DB_NAME: ${IDENTITY_DB_NAME:-identity}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:-identity}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity}
      OAUTH_PUBLIC_URL: ${OAUTH_PUBLIC_URL:-http://localhost:8080}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      KICK_CLIENT_ID: ${KICK_CLIENT_ID:-}
      KICK_CLIENT_SECRET: ${KICK_CLIENT_SECRET:-}
      COINS_API_TOKEN: ${COINS_API_TOKEN:-}
    volumes:
      - ./:/travian
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity_db:
        condition: service_healthy

  # The game world only advances while this runs: buildings finishing, troops
  # training and moving, resources ticking. Without it the site loads but
  # nothing ever completes.
  engine:
    build:
      context: ./docker/php
    command: ["php", "/travian/tools/engine.php"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./:/travian
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.25
    volumes:
      - ./:/travian:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - php

volumes:
  db_data:
  identity_data:
